<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#611A34" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Anna J'olad Cosmetics | Beauty &amp; Self-Care Essentials</title>
    <meta
      name="description"
      content="Anna J'olad Cosmetics — handcrafted lip, body and hair essentials made in small batches. Shop our collection and order easily on WhatsApp."
    />
    <meta property="og:title" content="Anna J'olad Cosmetics | Beauty & Self-Care Essentials" />
    <meta
      property="og:description"
      content="Handcrafted lip, body and hair essentials made in small batches. Order easily on WhatsApp."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Anna J'olad Cosmetics" />

    <!-- ===========================================================================
         🔗 LINK PREVIEW (WhatsApp / Facebook / Twitter / Telegram …)

         ✅ Works today AND after you move to a real custom domain: the image URL
            below points at Vercel, which keeps serving it even when your site is
            also live on e.g. www.annajoladcosmetics.com — so the picture never
            breaks when you add your domain.

         🌐 WHEN YOU GET YOUR REAL DOMAIN — update these THREE lines only:
              1. og:url          → https://your-domain.com/
              2. og:image        → https://your-domain.com/images/metatag.jpg
              3. twitter:image   → https://your-domain.com/images/metatag.jpg
            (these three meta tags below are the only place the domain appears
            as a URL — nothing else in the site needs changing)
            Then redeploy. To refresh WhatsApp/Facebook's cached preview, scrape
            once at https://developers.facebook.com/tools/debug/

         🖼️ TO CHANGE THE PREVIEW PICTURE: replace public/images/metatag.jpg
            (keep the same filename — no code edits needed).
    =========================================================================== -->
    <meta property="og:url" content="https://anna-jolad-cosmetics.vercel.app/" />
    <!-- Link-preview image — drop the picture at: public/images/metatag.jpg
         (absolute URL required so WhatsApp/social previews can load it). -->
    <meta property="og:image" content="https://anna-jolad-cosmetics.vercel.app/images/metatag.jpg" />
    <meta property="og:image:width" content="1169" />
    <meta property="og:image:height" content="941" />
    <meta
      property="og:image:alt"
      content="Anna J'olad Cosmetics — beauty and self-care essentials"
    />
    <!-- Twitter / X large preview card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Anna J'olad Cosmetics | Beauty & Self-Care Essentials" />
    <meta
      name="twitter:description"
      content="Handcrafted lip, body and hair essentials made in small batches. Order easily on WhatsApp."
    />
    <meta name="twitter:image" content="https://anna-jolad-cosmetics.vercel.app/images/metatag.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="font-sans antialiased bg-bone-100 text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
