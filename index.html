<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#611A34" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- ===========================================================================
         🔎 SEO + LINK PREVIEW HEAD — GENERATED, DO NOT HAND-EDIT THE TAGS

         Everything between the two markers below is rewritten for every route at
         build time by scripts/prerender.mjs, from one source of truth:
             src/seo/routes.ts  → titles, descriptions, priorities, sitemap entries
             src/seo/head.ts    → the <meta> / <link> / JSON-LD tags themselves
             src/seo/jsonLd.ts  → Organization, WebSite, Product, Breadcrumb, FAQ
         Change content in src/data/* (or the copy in src/seo/routes.ts) and run
         `npm run build` — never edit the tags by hand.

         The tags you see here are the home-page defaults used by `npm run dev`;
         in the built site each route has its own set, and the <Seo> component
         keeps them correct while visitors navigate.

         ✅ LIVE DOMAIN: https://www.annajoladcosmetics.app
            Moving to another domain means: SITE_URL in src/seo/routes.ts +
            public/robots.txt, rebuild, then refresh cached previews once at
            https://developers.facebook.com/tools/debug/

         🖼️ PREVIEW PICTURE: public/images/metatag.jpg — keep it 1200 x 630
            (1.91:1) and under 300 KB, otherwise WhatsApp shows a small thumbnail
            beside the text instead of the big picture above it. Rebuild it from
            the master photo with:
              powershell -ExecutionPolicy Bypass -File scripts\make-og-image.ps1

         🔍 GOOGLE SEARCH CONSOLE: add the property (a Domain property verified by
            a DNS TXT record needs no code change), then submit
            https://www.annajoladcosmetics.app/sitemap.xml
            Prefer the HTML-tag/file method? Drop Google's verification file into
            public/ (e.g. public/google1234abcd.html) — it deploys as-is.
    =========================================================================== -->
    <!--seo:start-->
    <title>Anna J'olad Cosmetics | Handcrafted Lip, Body &amp; Hair Care</title>
    <link rel="canonical" href="https://www.annajoladcosmetics.app/" />
    <meta
      name="description"
      content="Handcrafted lip glosses, soaps, body lotions and hair creams made with care by Anna J'olad Cosmetics. Order on WhatsApp, delivery in 24–72 hrs."
    />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <meta name="author" content="Anna J'olad Cosmetics" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Anna J'olad Cosmetics" />
    <meta property="og:title" content="Anna J'olad Cosmetics | Handcrafted Lip, Body &amp; Hair Care" />
    <meta
      property="og:description"
      content="Handcrafted lip glosses, soaps, body lotions and hair creams made with care by Anna J'olad Cosmetics. Order on WhatsApp, delivery in 24–72 hrs."
    />
    <meta property="og:url" content="https://www.annajoladcosmetics.app/" />
    <meta property="og:locale" content="en_NG" />
    <meta property="og:image" content="https://www.annajoladcosmetics.app/images/metatag.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Anna J'olad Cosmetics — handcrafted lip, body and hair care"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Anna J'olad Cosmetics | Handcrafted Lip, Body &amp; Hair Care" />
    <meta
      name="twitter:description"
      content="Handcrafted lip glosses, soaps, body lotions and hair creams made with care by Anna J'olad Cosmetics. Order on WhatsApp, delivery in 24–72 hrs."
    />
    <meta name="twitter:image" content="https://www.annajoladcosmetics.app/images/metatag.jpg" />
    <!--seo:end-->

    <link rel="apple-touch-icon" href="/images/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="font-sans antialiased bg-bone-100 text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
