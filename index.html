<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#611A34" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Anna J'olad Cosmetics | Beauty &amp; Self-Care Essentials</title>
    <meta
      name="description"
      content="Anna J'olad Cosmetics — handcrafted lip, body and hair essentials made in small batches. Shop our collection and order easily on WhatsApp."
    />
    <meta property="og:title" content="Anna J'olad Cosmetics | Beauty & Self-Care Essentials" />
    <meta
      property="og:description"
      content="Anna J'olad Cosmetics produces quality lip, body and hair care products formulated to help you look and feel your best."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Anna J'olad Cosmetics" />

    <!-- ===========================================================================
         🔗 LINK PREVIEW (WhatsApp / Facebook / Twitter / Telegram …)

         ✅ LIVE DOMAIN: https://www.annajoladcosmetics.app
            The three meta tags below use it, and the preview picture loads from
            the same domain (public/images/metatag.jpg deploys with the site).

         🌐 IF YOU EVER CHANGE DOMAINS AGAIN — update these THREE lines only:
              1. og:url          → https://your-new-domain/
              2. og:image        → https://your-new-domain/images/metatag.jpg
              3. twitter:image   → https://your-new-domain/images/metatag.jpg
            Then redeploy, and refresh cached previews once at
            https://developers.facebook.com/tools/debug/

         🖼️ TO CHANGE THE PREVIEW PICTURE: replace public/images/metatag.jpg
            (keep the same filename — no code edits needed).

         📐 KEEP IT 1200 x 630 (1.91:1) — that ratio is what makes WhatsApp
            show the big picture ABOVE the text. A square/near-square photo
            (e.g. 1169 x 941) makes WhatsApp shrink it to a small thumbnail
            BESIDE the text, and no meta tag can override that (Meta simply
            center-crops anything that isn't 1.91:1). Keep it under 300 KB
            too (WhatsApp skips oversized images).
            So the banner IS the photo, cropped to 1.91:1 — no blurred
            backdrop, no letterboxing bars. Rebuild it from the master photo
            anytime (add -Top <row> to pick a different slice of the photo):
              powershell -ExecutionPolicy Bypass -File scripts\make-og-image.ps1
    =========================================================================== -->
    <meta property="og:url" content="https://www.annajoladcosmetics.app/" />
    <!-- Link-preview image — drop the picture at: public/images/metatag.jpg
         (absolute URL required so WhatsApp/social previews can load it). -->
    <meta property="og:image" content="https://www.annajoladcosmetics.app/images/metatag.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Anna J'olad Cosmetics — beauty and self-care essentials"
    />
    <!-- Twitter / X large preview card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Anna J'olad Cosmetics | Beauty & Self-Care Essentials" />
    <meta
      name="twitter:description"
      content="Anna J'olad Cosmetics produces quality lip, body and hair care products formulated to help you look and feel your best."
    />
    <meta name="twitter:image" content="https://www.annajoladcosmetics.app/images/metatag.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="font-sans antialiased bg-bone-100 text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
